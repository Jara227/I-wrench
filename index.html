<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS.REPAIR // Root Access Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0d0d0d; color: #00ff66; padding: 20px; overflow-x: hidden; line-height: 1.5; }
        
        /* CRT Scanline efekt */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99999; opacity: 0.8; pointer-events: none; background-size: 100% 3px, 3px 100%;
        }

        /* Top Navigation */
        .top-bar { max-width: 1200px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; background-color: #121212; border: 1px solid #ff0055; padding: 15px; box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); text-transform: uppercase; }
        .rep-counter { font-weight: bold; color: #00ffff; text-shadow: 0 0 5px rgba(0, 255, 255, 0.5); }
        .rep-value { color: #ffff00; }

        /* Search Bar */
        .header-search { max-width: 1200px; margin: 0 auto 20px auto; display: flex; gap: 10px; }
        .search-input { flex: 1; background-color: #000; border: 1px solid #00ff66; color: #00ff66; padding: 15px; font-size: 1.1rem; outline: none; }
        .search-input:focus { border-color: #ff0055; }
        .search-input::placeholder { color: #005522; text-transform: uppercase; }
        .search-label { background-color: #00ff66; color: #000; padding: 15px; font-weight: bold; font-size: 1.1rem; text-transform: uppercase; }

        /* Layout */
        .layout { display: flex; max-width: 1200px; margin: 0 auto; gap: 20px; }
        
        /* Sidebar */
        .sidebar { flex: 1; border: 1px solid #ff0055; background-color: #121212; padding: 20px; height: fit-content; }
        .sidebar-title { color: #ff0055; font-size: 1.1rem; margin-bottom: 20px; border-bottom: 1px dashed #ff0055; padding-bottom: 10px; text-transform: uppercase; }
        
        .exploit-link { 
            display: block; color: #00ff66; text-decoration: none; padding: 10px; 
            border: 1px solid transparent; margin-bottom: 10px; cursor: pointer; transition: 0.2s;
        }
        .exploit-link:hover, .exploit-link.active { border: 1px solid #00ff66; background-color: rgba(0, 255, 102, 0.1); }
        .exploit-link::before { content: "[>] "; color: #00ffff; }
        .exploit-link.hacked { color: #555; border-color: #333; }
        .exploit-link.hacked::before { content: "[OK] "; color: #00ff66; }

        .hidden { display: none !important; }

        /* Main Content */
        .main-content { flex: 3; border: 1px solid #00ff66; background-color: #121212; padding: 30px; min-height: 500px; position: relative; }
        
        .guide-header { border-bottom: 1px dashed #00ff66; padding-bottom: 20px; margin-bottom: 25px; }
        .glitch { font-size: 2rem; font-weight: bold; text-transform: uppercase; color: #fff; text-shadow: 0.05em 0 0 #ff0055, -0.025em -0.05em 0 #00ffff; animation: glitch 2s infinite; margin-bottom: 5px; }
        .guide-meta { color: #00ffff; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 #ff0055, -0.025em -0.05em 0 #00ffff; }
            14% { text-shadow: 0.05em 0 0 #ff0055, -0.025em -0.05em 0 #00ffff; }
            15% { text-shadow: -0.05em -0.025em 0 #ff0055, 0.025em 0.025em 0 #00ffff; }
            49% { text-shadow: -0.05em -0.025em 0 #ff0055, 0.025em 0.025em 0 #00ffff; }
            50% { text-shadow: 0.025em 0.05em 0 #ff0055, 0.05em 0 0 #00ffff; }
            99% { text-shadow: 0.025em 0.05em 0 #ff0055, 0.05em 0 0 #00ffff; }
            100% { text-shadow: -0.025em 0 0 #ff0055, -0.025em -0.025em 0 #00ffff; }
        }

        /* Affiliate Section */
        .affiliate-box { border: 1px solid #00ffff; background: rgba(0, 255, 255, 0.05); padding: 20px; margin-bottom: 30px; display: none; }
        .affiliate-box h3 { color: #00ffff; font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; }
        .affiliate-links { display: flex; flex-direction: column; gap: 10px; list-style: none; }
        .affiliate-btn { display: flex; justify-content: space-between; background: #000; color: #00ff66; text-decoration: none; padding: 12px 15px; border: 1px solid #00ff66; font-size: 0.95rem; text-transform: uppercase; transition: 0.2s; }
        .affiliate-btn:hover { background: #00ff66; color: #000; box-shadow: 0 0 10px rgba(0, 255, 102, 0.4); }
        .affiliate-disclaimer { font-size: 0.75rem; color: #555; margin-top: 15px; text-transform: uppercase; }

        /* Loader */
        #loader { display: none; color: #ff0055; margin-top: 50px; font-size: 1.2rem; text-transform: uppercase; }
        .progress-bar { width: 100%; height: 2px; background: #333; margin-top: 10px; position: relative; }
        .progress-fill { height: 100%; background-color: #ff0055; width: 0%; transition: width 0.1s; box-shadow: 0 0 10px #ff0055; }

        /* Guide Steps */
        #guide-container { display: block; }
        .phase { margin-bottom: 30px; border-left: 2px solid #ff0055; padding-left: 15px; }
        .phase-title { color: #ffff00; font-size: 1.2rem; text-transform: uppercase; margin-bottom: 5px; }
        .phase-meta { color: #555; font-size: 0.85rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .phase p { color: #ccc; margin-bottom: 10px; }

        /* Button */
        .complete-btn { display: block; width: 100%; background: #000; color: #00ff66; border: 1px solid #00ff66; padding: 15px; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-top: 40px; transition: 0.2s; }
        .complete-btn:hover { background: #00ff66; color: #000; }
        .complete-btn.done { background: #121212; color: #555; border-color: #333; pointer-events: none; }

        @media (max-width: 768px) { .layout { flex-direction: column; } .header-search { flex-direction: column; } }
    </style>
</head>
<body>

<div class="top-bar">
    <div>NODE: GLOBAL // STATUS: <span style="color: #00ff66;">SECURE</span></div>
    <div class="rep-counter">COMPILED_REPAIRS: <span class="rep-value" id="rep-display">0</span></div>
</div>

<div class="header-search">
    <div class="search-label">SYS.QUERY</div>
    <input type="text" class="search-input" id="search-box" placeholder="Identify target (e.g., iPhone, Drift)...">
</div>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-title">Data Nodes</div>
        <div id="sidebar-links"></div>
    </div>

    <div class="main-content">
        <div class="guide-header">
            <div class="glitch" id="main-title">TERMINAL_STANDBY</div>
            <div class="guide-meta" id="sub-title">AWAITING TARGET SELECTION...</div>
        </div>

        <div id="loader">
            <p>> FETCHING SCHEMATICS...</p>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>

        <div id="affiliate-container" class="affiliate-box">
            <h3>[!] REQUIRED_ASSETS</h3>
            <ul id="affiliate-links-list" class="affiliate-links">
                </ul>
            <p class="affiliate-disclaimer">LOG: Acquiring assets via these secure links supports system maintenance (Affiliate Disclosure).</p>
        </div>

        <div id="guide-container">
            <div style="text-align: center; color: #333; margin-top: 50px;">[ NULL_DATA ]</div>
        </div>
    </div>
</div>

<script src="data.js"></script>

<script>
    let userProgress = JSON.parse(localStorage.getItem('sysrepair_progress')) || { completed: [], count: 0 };
    let currentOperationId = null;

    const sidebarContainer = document.getElementById('sidebar-links');
    const searchBox = document.getElementById('search-box');
    const repDisplay = document.getElementById('rep-display');
    const affiliateContainer = document.getElementById('affiliate-container');
    const affiliateList = document.getElementById('affiliate-links-list');

    function updateRepDisplay() {
        repDisplay.innerText = userProgress.count;
    }

    function renderSidebar() {
        sidebarContainer.innerHTML = '';
        for (const [key, data] of Object.entries(database)) {
            const link = document.createElement('div');
            link.className = 'exploit-link';
            link.innerText = data.menuLabel;
            link.setAttribute('data-key', key);
            link.setAttribute('data-tags', data.searchTags);
            
            if (userProgress.completed.includes(key)) {
                link.classList.add('hacked');
            }
            
            link.onclick = function() { loadGuide(key, this); };
            sidebarContainer.appendChild(link);
        }
        updateRepDisplay();
    }
    
    renderSidebar();

    searchBox.addEventListener('keyup', function() {
        const query = this.value.toLowerCase();
        const links = document.querySelectorAll('.exploit-link');
        links.forEach(link => {
            const tags = link.getAttribute('data-tags');
            const label = link.innerText.toLowerCase();
            if (tags.includes(query) || label.includes(query)) {
                link.classList.remove('hidden');
            } else {
                link.classList.add('hidden');
            }
        });
    });

    function loadGuide(id, clickedElement) {
        document.querySelectorAll('.exploit-link').forEach(link => link.classList.remove('active'));
        if(clickedElement) clickedElement.classList.add('active');
        
        currentOperationId = id; 

        const container = document.getElementById('guide-container');
        const loader = document.getElementById('loader');
        const progress = document.getElementById('progress');
        const mainTitle = document.getElementById('main-title');
        const subTitle = document.getElementById('sub-title');

        container.style.display = 'none';
        affiliateContainer.style.display = 'none';
        loader.style.display = 'block';
        
        mainTitle.innerText = "DECRYPTING_DATA";
        subTitle.innerHTML = "[ IN_PROGRESS ]";
        
        let width = 0;
        const interval = setInterval(() => {
            width += Math.floor(Math.random() * 20) + 15;
            if (width >= 100) width = 100;
            progress.style.width = width + '%';

            if (width === 100) {
                clearInterval(interval);
                setTimeout(() => {
                    loader.style.display = 'none';
                    progress.style.width = '0%';
                    
                    mainTitle.innerText = database[id].title;
                    subTitle.innerHTML = `TIME_EST: ${database[id].time} // DIFF: ${database[id].difficulty}`;
                    
                    // Generate Affiliate Links
                    affiliateList.innerHTML = '';
                    if(database[id].affiliates && database[id].affiliates.length > 0) {
                        database[id].affiliates.forEach(item => {
                            const li = document.createElement('li');
                            li.innerHTML = `<a href="${item.url}" target="_blank" class="affiliate-btn">
                                                <span>${item.name}</span>
                                                <span style="color: #ff0055;">[ EXT_LINK ]</span>
                                            </a>`;
                            affiliateList.appendChild(li);
                        });
                        affiliateContainer.style.display = 'block';
                    }
                    
                    const isCompleted = userProgress.completed.includes(id);
                    const btnClass = isCompleted ? "complete-btn done" : "complete-btn";
                    const btnText = isCompleted ? "[ LOG_VERIFIED: REPAIR_DONE ]" : "[ EXECUTE: MARK_AS_REPAIRED ]";

                    container.innerHTML = database[id].html + `<button class="${btnClass}" onclick="completeOperation()">${btnText}</button>`;
                    
                    container.style.display = 'block';
                }, 200);
            }
        }, 60); 
    }

    function completeOperation() {
        if (!currentOperationId || userProgress.completed.includes(currentOperationId)) return;

        userProgress.completed.push(currentOperationId);
        userProgress.count += 1;
        localStorage.setItem('sysrepair_progress', JSON.stringify(userProgress));

        updateRepDisplay();
        renderSidebar(); 
        
        const btn = document.querySelector('.complete-btn');
        if(btn) {
            btn.classList.add('done');
            btn.innerText = "[ LOG_VERIFIED: REPAIR_DONE ]";
        }
    }
</script>

</body>
</html>
