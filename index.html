<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechRepair // Návody na opravu elektroniky</title>
    <style>
        /* Moderní čistý design (Dark Mode) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 20px; line-height: 1.6; }
        
        /* Horní lišta */
        .top-bar { max-width: 1200px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; background-color: #1e1e1e; border: 1px solid #333; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .logo { font-size: 1.2rem; font-weight: bold; color: #4dabf7; }
        .rep-counter { font-size: 1rem; font-weight: 500; color: #a8b2d1; }
        .rep-value { color: #51cf66; font-weight: bold; }

        /* Vyhledávání */
        .header-search { max-width: 1200px; margin: 0 auto 20px auto; display: flex; gap: 10px; }
        .search-input { flex: 1; background-color: #1e1e1e; border: 1px solid #333; color: #fff; padding: 12px 15px; font-size: 1.1rem; border-radius: 8px; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: #4dabf7; box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2); }

        /* Layout */
        .layout { display: flex; max-width: 1200px; margin: 0 auto; gap: 20px; }
        
        /* Levý panel s menu */
        .sidebar { flex: 1; background-color: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px; height: fit-content; }
        .sidebar-title { color: #868e96; font-size: 0.9rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        
        .exploit-link { 
            display: block; color: #e0e0e0; text-decoration: none; padding: 10px 15px; 
            border-radius: 6px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; font-weight: 500;
        }
        .exploit-link:hover, .exploit-link.active { background-color: #2c2e33; color: #4dabf7; }
        
        .exploit-link.hacked { color: #868e96; text-decoration: line-through; }
        .exploit-link.hacked::before { content: "✓ "; color: #51cf66; text-decoration: none; display: inline-block; font-weight: bold; }
        .exploit-link.hacked:hover { color: #51cf66; text-decoration: none; }

        .hidden { display: none !important; }

        /* Hlavní okno návodu */
        .main-content { flex: 3; background-color: #1e1e1e; border: 1px solid #333; padding: 40px; border-radius: 8px; min-height: 500px; }
        
        .guide-header { text-align: left; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .guide-title { font-size: 2rem; font-weight: 700; color: #ffffff; margin-bottom: 5px; }
        .guide-subtitle { color: #868e96; font-size: 1rem; }

        /* Box pro nářadí */
        .tools-container { display: none; background: #25262b; border-left: 4px solid #4dabf7; padding: 15px 20px; margin-bottom: 30px; border-radius: 4px; color: #c1c2c5; font-size: 0.95rem; }

        /* Načítání */
        #loader { display: none; text-align: center; color: #868e96; margin-top: 100px; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #4dabf7; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Tlačítko pro dokončení */
        .complete-btn { 
            display: block; width: 100%; background: #4dabf7; color: #fff; border: none; border-radius: 6px;
            padding: 15px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 40px; transition: 0.2s; 
        }
        .complete-btn:hover { background: #3b8cd9; }
        .complete-btn.done { background: #2c2e33; color: #868e96; cursor: default; }

        #guide-container { display: block; }
        
        /* Styly pro načtené HTML z data.js */
        .phase { margin-bottom: 35px; }
        .phase-title { color: #ffffff; font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
        .phase-meta { color: #4dabf7; font-size: 0.85rem; margin-bottom: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .phase p { color: #c1c2c5; margin-bottom: 15px; font-size: 1.05rem; }

        @media (max-width: 768px) { .layout { flex-direction: column; } .main-content { padding: 20px; } }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="logo">TechRepair Návody</div>
    <div class="rep-counter">Zkušenosti (XP): <span class="rep-value" id="rep-display">0</span></div>
</div>

<div class="header-search">
    <input type="text" class="search-input" id="search-box" placeholder="Hledat zařízení (např. iPhone, PS4)...">
</div>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-title">Dostupné návody</div>
        <div id="sidebar-links"></div>
    </div>

    <div class="main-content">
        <div class="guide-header">
            <div class="guide-title" id="main-title">Vyberte návod z levého menu</div>
            <div class="guide-subtitle" id="sub-title">Zde se zobrazí detailní postup opravy.</div>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <p>Načítám postup opravy...</p>
        </div>

        <div id="tools" class="tools-container"></div>

        <div id="guide-container">
            <div style="text-align: center; color: #555; margin-top: 50px;">Zatím není vybráno žádné zařízení.</div>
        </div>
    </div>
</div>

<script src="data.js"></script>

<script>
    let userProgress = JSON.parse(localStorage.getItem('techrepair_progress')) || { completed: [], followers: 0 };
    let currentOperationId = null;

    const sidebarContainer = document.getElementById('sidebar-links');
    const searchBox = document.getElementById('search-box');
    const repDisplay = document.getElementById('rep-display');

    function updateRepDisplay() {
        repDisplay.innerText = userProgress.followers.toLocaleString();
    }

    function renderSidebar() {
        sidebarContainer.innerHTML = '';
        for (const [key, data] of Object.entries(database)) {
            const link = document.createElement('div');
            link.className = 'exploit-link';
            link.innerText = data.menuLabel;
            link.setAttribute('data-key', key);
            link.setAttribute('data-tags', data.searchTags);
            
            if (userProgress.completed.includes(key)) {
                link.classList.add('hacked');
            }
            
            link.onclick = function() { loadGuide(key, this); };
            sidebarContainer.appendChild(link);
        }
        updateRepDisplay();
    }
    
    renderSidebar();

    searchBox.addEventListener('keyup', function() {
        const query = this.value.toLowerCase();
        const links = document.querySelectorAll('.exploit-link');
        links.forEach(link => {
            const tags = link.getAttribute('data-tags');
            const label = link.innerText.toLowerCase();
            if (tags.includes(query) || label.includes(query)) {
                link.classList.remove('hidden');
            } else {
                link.classList.add('hidden');
            }
        });
    });

    function loadGuide(id, clickedElement) {
        document.querySelectorAll('.exploit-link').forEach(link => link.classList.remove('active'));
        if(clickedElement) clickedElement.classList.add('active');
        
        currentOperationId = id; 

        const container = document.getElementById('guide-container');
        const loader = document.getElementById('loader');
        const mainTitle = document.getElementById('main-title');
        const subTitle = document.getElementById('sub-title');
        const toolsContainer = document.getElementById('tools');

        container.style.display = 'none';
        toolsContainer.style.display = 'none';
        loader.style.display = 'block';
        
        mainTitle.innerText = "Načítání...";
        subTitle.innerText = "";
        
        // Simulace krátkého načítání pro plynulý přechod
        setTimeout(() => {
            loader.style.display = 'none';
            
            mainTitle.innerText = database[id].title;
            subTitle.innerText = database[id].sub;
            toolsContainer.innerHTML = "<strong>🔧 Potřebné nářadí:</strong><br>" + database[id].tools;
            
            const isCompleted = userProgress.completed.includes(id);
            const btnClass = isCompleted ? "complete-btn done" : "complete-btn";
            const btnText = isCompleted ? "Tato oprava již byla dokončena" : `Označit jako opravené (+${database[id].reward} XP)`;

            container.innerHTML = database[id].html + `<button class="${btnClass}" onclick="completeOperation()">${btnText}</button>`;
            
            toolsContainer.style.display = 'block';
            container.style.display = 'block';
        }, 400); 
    }

    function completeOperation() {
        if (!currentOperationId || userProgress.completed.includes(currentOperationId)) return;

        userProgress.completed.push(currentOperationId);
        userProgress.followers += database[currentOperationId].reward;
        localStorage.setItem('techrepair_progress', JSON.stringify(userProgress));

        updateRepDisplay();
        renderSidebar(); 
        
        const btn = document.querySelector('.complete-btn');
        if(btn) {
            btn.classList.add('done');
            btn.innerText = "Oprava byla úspěšně dokončena";
        }
    }
</script>

</body>
</html>
